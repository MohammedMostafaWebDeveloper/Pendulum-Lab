<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pendulum Lab</title>
</head>
<body>
    <canvas></canvas>
    <div id="tools">
        <div class="tool">
            Pendulums count
            <input type="range" min="1" value="2" max="20" id="count">
        </div>
        <div class="tool">
            Gravitational acceleration
            <input type="range" min="0" value="500" max="1000" id="gravity">
        </div>
        <div class="tool">
            Segment Length
            <input type="range" min="50" value="100" max="250" id="length">
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
